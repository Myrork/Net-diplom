- name: install Docker
  hosts: all
  become: yes
  tasks:
    - name: install dependencies
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg-agent
        - software-properties-common

    - name: add GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: add docker repository to apt
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu bionic stable
        state: present

    - name: install docker
      apt:
        name: "{{ item }}"
        state: latest
        update_cache: yes
      loop:
        - docker-ce
        - docker-ce-cli
        - containerd.io
      retries: 10
      delay: 30 

# On a fresh Ubuntu server, the unattended-upgrades service is often running.
# It automatically updates packages after startup.
# At this point, dpkg is already busy, and Ansible cannot perform apt install.
# Therefore, Ansible crashes with the error "Could not get lock"
 
    - name: check docker is active
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure group "docker" exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: adding user to docker group
      user:
        name: ilya-serv
        groups: docker
        append: yes

