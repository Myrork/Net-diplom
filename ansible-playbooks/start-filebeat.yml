---
- name: Deploy Filebeat
  hosts: web
  become: true
  vars_files:
    - ./templates/vars-elastic.yml

  tasks:
    - name: Create Filebeat config directory
      file:
        path: /etc/filebeat
        state: directory
        mode: "0755"

    - name: Copy Filebeat configuration
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: log
              enabled: true
              paths:
                - /var/log/nginx/access.log
              fields:
                log_type: nginx_access
              fields_under_root: true

            - type: log
              enabled: true
              paths:
                - /var/log/nginx/error.log
              fields:
                log_type: nginx_error
              fields_under_root: true

          output.elasticsearch:
            hosts: ["http://{{ elasticsearch_host }}:9200"]

    - name: Start Filebeat container
      docker_container:
        name: filebeat
        image: elastic/filebeat:8.15.2
        user: root
        command: ["--strict.perms=false", "-e", "-d", "*" ]
        volumes:
          - "/etc/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro"
          - "/var/log/nginx:/var/log/nginx:ro"
        state: started
        restart_policy: always
